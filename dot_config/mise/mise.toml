[settings]
# tools can read the versions files used by other version managers
# for example, .nvmrc in the case of node's nvm
# idiomatic_version_file_enable_tools = ['node']
idiomatic_version_file = true

# configure `mise install` to always keep the downloaded archive
always_keep_install = false  # deleted on failure by default

# configure how frequently (in minutes) to fetch updated plugin repository changes
# this is updated whenever a new runtime is installed
# (note: this isn't currently implemented but there are plans to add it: https://github.com/jdx/mise/discussions/6735)
# plugin_autoupdate_last_check_duration = '1 week' # set to 0 to disable updates

# config files with these prefixes will be trusted by default
trusted_config_paths = ['~/work']

verbose = false      # set to true to see full installation output, see `MISE_VERBOSE`
http_timeout = "30s" # set the timeout for http requests as duration string, see `MISE_HTTP_TIMEOUT`
jobs = 4             # number of plugins or runtimes to install in parallel. The default is `4`.
raw = false          # set to true to directly pipe plugins to stdin/stdout/stderr
yes = false          # set to true to automatically answer yes to all prompts

not_found_auto_install = true # see MISE_NOT_FOUND_AUTO_INSTALL
# task.output = "prefix" # see Tasks Runner for more information
paranoid = false # see MISE_PARANOID

# shorthands_file = '~/.config/mise/shorthands.toml' # path to the shorthands file, see `MISE_SHORTHANDS_FILE`
# disable_default_shorthands = false # disable the default shorthands, see `MISE_DISABLE_DEFAULT_SHORTHANDS`
# disable_tools = ['node']           # disable specific tools, generally used to turn off core tools

env_file = '.env' # load env vars from a dotenv file, see `MISE_ENV_FILE`

experimental = true # enable experimental features

# configure messages displayed when entering directories with config files
# status = {
#   missing_tools = "if_other_versions_installed",
#   show_env = false,
#   show_tools = false,
# }

# "_" is a special key for information you'd like to put into mise.toml that mise will never parse
# [_]
# foo = "bar"
# python.uv_venv_auto = "create|source"
python.uv_venv_auto = "source"

[env]
# _.python.venv = { path = ".venv", create = true }

# Add local bin to PATH
_.path = [
  "~/.local/bin",
  "~/.local/share/nvim/mason/bin",
  "node_modules/.bin",
  "./bin",
]

# ---------------------------------------------------------------------------
# wt — a worktree per concurrent session (global: works in any repo)
# ---------------------------------------------------------------------------
# A git checkout holds ONE branch, and `git checkout` is global to it. When a
# second session shares a checkout, its checkout moves the branch out from under
# a commit — on 2026-11-17 that landed a feature commit on `main`. Isolation has
# to be a directory, so this is the one command to get one.
#
# Lives here rather than in a repo's .mise/config.toml so the rule is the same
# everywhere an agent works. `git worktree` shares the object store, so merging
# between the worktree and main costs nothing extra.
#
# Usage: mise run wt <branch-or-name>   → prints the path to cd into
#
# Must also work from a BARE repo — `~/clone/home-ops` is one (object store +
# worktrees, no checkout of its own), and `rev-parse --show-toplevel` fails there
# with "must be run in a work tree" exactly like `git status` does. Verified
# 2026-11-24: cleaning every worktree left nowhere to stand, and `mise run wt
# main` answered "not a git repository" from inside the repo. --git-common-dir
# is the one query that never needs a work tree, and the bare root and every
# linked worktree share it, so its parent is the repo root in all three shapes
# (bare / plain checkout / linked worktree). It is relative to cwd — resolve
# before taking `..`.
[tasks.wt]
description = "Create a git worktree for a concurrent session: mise run wt <branch-or-name>"
# dir = {{cwd}} is load-bearing: mise runs a task in the directory of the config
# file that declares it, which for a GLOBAL task is ~/.config/mise — not a git
# repository. (The repo-local copy this replaced got away without it only because
# the config file happened to sit at the repo root.) Verified 2026-11-17 by
# running it from a checkout and getting "fatal: not a git repository".
dir = "{{cwd}}"
run = '''
bash -c '
set -euo pipefail
name="${1:?usage: mise run wt <branch-or-name>}"
common=$(git rev-parse --git-common-dir 2>/dev/null) \
    || { printf "wt: %s is not a git repository — cd into a checkout first\n" "$PWD" >&2; exit 2; }
repo=$(cd "$common/.." && pwd -P)
base="$HOME/wt/$(basename "$repo")"
dest="$base/$name"
mkdir -p "$base"
if [ -e "$dest" ]; then
    printf "wt: %s already exists — cd there\n" "$dest" >&2
else
    # -B so the name is the branch: an existing branch is reused, a new one forks
    # from the current HEAD, which is what a session starting work wants.
    git -C "$repo" worktree add -B "$name" "$dest" HEAD >&2
fi
printf "%s\n" "$dest"
' _ "$@"
'''
